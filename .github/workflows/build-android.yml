name: Build Android APK (BOSS Aluminium)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Install Capacitor Android & Generate Native Project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions & Launcher Icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />|' "$MANIFEST"
          fi
          if [ -f "public/pwa-512x512.png" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "android/app/src/main/res/$dir"
              cp "public/pwa-512x512.png" "android/app/src/main/res/$dir/ic_launcher.png"
              cp "public/pwa-512x512.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
            done
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../release-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../release-apk/BOSS-Aluminium.apk

      - name: Upload BOSS-Aluminium.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-Aluminium-APK
          path: release-apk/BOSS-Aluminium.apk
          if-no-files-found: error
