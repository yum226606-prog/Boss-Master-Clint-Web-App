name: Build Android APK (BOSS Aluminium)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Initialize Capacitor Android, Apply Logo & build APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/app @capacitor/browser @capacitor/share @capacitor/filesystem --legacy-peer-deps
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon.png
          cp public/pwa-512x512.png assets/splash.png
          rm -rf android
          npx cap add android
          node scripts/configure-android-native.mjs
          npx @capacitor/assets generate --android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BOSS-Aluminium-Client.apk

      - name: Upload BOSS-Aluminium.apk
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-Aluminium-APK
          path: BOSS-Aluminium-Client.apk

      - name: Auto Release APK to Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: BOSS Aluminium Client (Latest Auto-Build)
          make_latest: true
          files: BOSS-Aluminium-Client.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
