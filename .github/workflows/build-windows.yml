name: Build Windows Setup EXE (BOSS Aluminium)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Build Windows NSIS Setup (.exe)
        run: |
          npm install electron electron-builder --save-dev --legacy-peer-deps
          npx electron-builder --win nsis --publish never --config.win.icon=null --config.nsis.installerIcon=null --config.nsis.uninstallerIcon=null

      - name: Upload BOSS-Aluminium-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-Aluminium-Windows-Setup
          path: dist-electron/*.exe
