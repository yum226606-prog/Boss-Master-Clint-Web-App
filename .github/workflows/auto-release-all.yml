name: Auto Release Android APK & Windows EXE

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web & Sync Capacitor Android
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BOSS-Aluminium-Client.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BOSS-Aluminium-Client.apk

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web & Package Windows EXE
        run: |
          npm install
          npm run build
          if (Test-Path "electron") {
            npx electron-builder --win portable --x64
            $exe = Get-ChildItem -Path "dist*" -Recurse -Filter "*.exe" | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName -Destination "BOSS-Aluminium-Client.exe" }
          } else {
            npx --yes nativefier "https://vercel.app" --name "BOSS Aluminium" --platform windows --arch x64 --single-instance --out win-out
            $exe = Get-ChildItem -Path "win-out" -Recurse -Filter "*.exe" | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName -Destination "BOSS-Aluminium-Client.exe" }
          }

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: BOSS-Aluminium-Client.exe

  publish-release:
    needs: [build-android-apk, build-windows-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish Latest Release (APK + EXE)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: BOSS Aluminium Client (Latest Auto-Build)
          make_latest: true
          files: |
            release-files/BOSS-Aluminium-Client.apk
            release-files/BOSS-Aluminium-Client.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
